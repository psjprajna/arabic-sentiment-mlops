[project]
name = "arabic-sentiment-mlops"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
ml = [
    "transformers>=4.40",
    "catboost>=1.2",
    "scikit-learn>=1.5",
    "mlflow>=2.14",
    "torch>=2.3",
    "datasets>=2.18",
    "peft>=0.11",
    "accelerate>=0.30",
    "evaluate>=0.4",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentiment", "src/api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
